<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Document</title>
    <style>
        .products-section {
            padding: 40px;
            background-color: #f5f5f5;
        }
        
        .products-section h2 {
            text-align: center;
            margin-bottom: 30px;
            font-family: Arial, sans-serif;
        }
        
        .products-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .product-card {
            width: 220px;
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .product-card h3 {
            margin: 15px 0 10px;
            font-family: Arial, sans-serif;
        }
        
        .product-card p {
            color: #27ae60;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <section class="container py-5">
        <h2 class="text-center mb-5 fw-bold">Our Products</h2>
        <div class="row g-4" id="products-container">


        </div>
    </section>

    <script>
        async function loadProduct() {
            const response = await fetch('https://fakestoreapi.com/products');
            const products = await response.json();

            const card = document.querySelector("#products-container");
            products.forEach(element => {
                const productCard = document.createElement(`div`);
                productCard.classList.add("col-12", "col-sm-6", "col-md-4", "col-lg-3");

                productCard.innerHTML = `<div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                <img src="${element.image}"   class="card-img-top p-4"
                    style="height: 250px; object-fit: contain;" alt="${element.title}">  
                <div class="card-body d-flex flex-column">

                <h3 class="card-title fs-5 fw-bold text-center">${element.title}</h3>
                <p class="text-success fs-4 fw-bold mb-3 text-center">${element.price}$</p>
                 </div>
                    </div>`;
                card.appendChild(productCard);
            });
        }
        loadProduct();
    </script>
</body>

</html>
