<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add/Remove Items</title>
</head>

<body>
    <h2>Task 4: Add and Remove Items</h2>
    <input type="text" id="itemInput" placeholder="Add item">
    <button onclick="addItem()">Add</button>
    <ul id="itemList"></ul>

    <script>
        var itemList = document.getElementById("itemList")

        function addItem() {

            var itemInput = document.getElementById("itemInput").value;
            var li = document.createElement('li');
            //   btn.innerText = "delete";
            li.innerText = itemInput;
            itemList.appendChild(li);
            li.innerHTML = (`${itemInput}<button onclick="this.parentElement.remove()">Delete</button>`);
            document.getElementById("itemInput").value = "";

        }
    </script>
</body>

</html>
