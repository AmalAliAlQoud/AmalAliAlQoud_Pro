<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p> how many characters remain out of 100</p>

    <textarea id="textArea" rows="5" cols="30"></textarea>

    <p id="output"></p>

    <script>
        document.getElementById("textArea").addEventListener("input", (e) => {
            document.getElementById("output").innerText = 100 - e.target.value.length;
        });
    </script>
</body>

</html>
