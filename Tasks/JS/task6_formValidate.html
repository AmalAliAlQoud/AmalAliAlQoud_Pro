<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dynamic Form Validation</title>
</head>

<body>
    <h2>Form Validation</h2>
    <form id="myForm">
        <input type="text" id="name" placeholder="Name"><br>
        <input type="email" id="email" placeholder="Email"><br>
        <input type="tel" id="phone" placeholder="Phone"><br>
        <button type="submit">Submit</button>
        <p id="errorMsg" style="color:red;"></p>
    </form>
    <script>
        document.getElementById("myForm").addEventListener("submit", (e) => {
            e.preventDefault();
            var name = document.getElementById("name").value.trim();
            var mail = document.getElementById("email").value.trim();
            var tel = document.getElementById("phone").value.trim();


            if (!name || !mail || !tel)
                document.getElementById("errorMsg").innerText = "all fiel is required";
            else
                document.getElementById("errorMsg").innerText = "";
        });
    </script>

</body>

</html>
