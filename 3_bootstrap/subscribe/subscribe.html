<!-- صفحة الاشتراك -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <meta charset="UTF-8">
    <title>اشترك الآن</title>
</head>

<body>
    <header class="container-fluid p-4 text-white d-flex flex-column" style="background-color: #172554;">
        <h1 class="text-center mb-3">اشترك في المنصة</h1>
        <nav class="align-self-center"><a class="btn btn-outline-light btn-sm px-3" href="../index/index.html">الصفحة الرئيسية</a></nav>
    </header>

    <main class="container-fluid">
        <section class="container p-5  my-5 border text-bg-light">
            <form class="border p-5 shadow-sm">
                <div class="row">
                    <div class="col">
                        <label>الاسم الكامل:</label><br>
                        <input type="text" class="form-control mt-2" placeholder="مثال: أحمد علي"><br><br>

                        <label>البريد الإلكتروني:</label><br>
                        <input type="email" class="form-control mt-2" placeholder="you@example.com"><br><br>
                    </div>
                    <div class="col">
                        <label>كلمة المرور:</label><br>
                        <input type="password" class="form-control mt-2"><br><br>

                        <label>تأكيد كلمة المرور:</label><br>
                        <input type="password" class="form-control mt-2"><br><br>
                    </div>
                </div>
                <button class="btn btn-primary mt-3" style="width: 150px;">اشترك الآن</button>
            </form>
        </section>
    </main>

    <footer class="container-fluid bg-dark text-white text-center py-4 mt-5 ">

        <p>© 2025 الاشتراك في المنصة</p>
    </footer>
</body>

</html>
